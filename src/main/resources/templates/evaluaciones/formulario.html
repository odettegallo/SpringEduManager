<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Calificaciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 th:text="${evaluacion.id} ? 'Editar Notas' : 'Asignar Notas'">Asignar Notas</h2>

    <form th:action="@{/evaluaciones/guardar}" th:object="${evaluacion}" method="post" class="mt-3">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Estudiante:</label>
            <select th:field="*{estudiante.id}" class="form-select" required>
                <option value="">Seleccione un estudiante</option>
                <option th:each="e : ${estudiantes}" th:value="${e.id}" th:text="${e.nombre + ' ' + e.apellido}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Curso:</label>
            <select th:field="*{curso.id}" class="form-select" required>
                <option value="">Seleccione un curso</option>
                <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Nota 1 (Práctica):</label>
                <input type="number" step="0.1" th:field="*{nota1}" class="form-control" required/>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Nota 2 (Parcial):</label>
                <input type="number" step="0.1" th:field="*{nota2}" class="form-control" required/>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Nota 3 (Examen):</label>
                <input type="number" step="0.1" th:field="*{nota3}" class="form-control" required/>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/evaluaciones}" class="btn btn-secondary">Cancelar</a>
    </form>

</body>
</html>
