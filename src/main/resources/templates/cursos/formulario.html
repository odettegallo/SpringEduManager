<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Registrar Nuevo Curso</h2>
    <form th:action="@{/cursos/guardar}" th:object="${curso}" method="post" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Nombre del Curso:</label>
            <input type="text" th:field="*{nombre}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción:</label>
            <textarea th:field="*{descripcion}" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Guardar Curso</button>
        <a th:href="@{/cursos}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
