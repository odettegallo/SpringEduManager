<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asignar Notas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Asignar / Registrar Notas</h2>
    <form th:action="@{/cursos/notas/guardar}" th:object="${evaluacion}" method="post" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Estudiante:</label>
            <select th:field="*{estudiante.id}" class="form-select" required>
                <option th:each="est : ${estudiantes}" th:value="${est.id}" th:text="${est.nombre + ' ' + est.apellido}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Curso:</label>
            <select th:field="*{curso.id}" class="form-select" required>
                <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Parcial 1:</label>
                <input type="number" step="0.1" min="1" max="7" th:field="*{nota1}" class="form-control" required/>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Parcial 2:</label>
                <input type="number" step="0.1" min="1" max="7" th:field="*{nota2}" class="form-control" required/>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Parcial 3:</label>
                <input type="number" step="0.1" min="1" max="7" th:field="*{nota3}" class="form-control" required/>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Guardar Notas</button>
        <a th:href="@{/cursos}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
