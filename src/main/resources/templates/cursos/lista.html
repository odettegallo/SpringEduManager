<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cursos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Catálogo de Cursos</h2>
    <a th:href="@{/cursos/nuevo}" class="btn btn-primary mb-3">Crear Nuevo Curso</a>

    <table class="table table-striped border">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre del Curso</th>
                <th>Descripción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="curso : ${cursos}">
                <td th:text="${curso.id}">1</td>
                <td th:text="${curso.nombre}">Java Spring Boot</td>
                <td th:text="${curso.descripcion}">Curso completo de Spring Boot y desarrollo web</td>
            </tr>
        </tbody>
    </table>
    
    <a th:href="@{/estudiantes}" class="btn btn-secondary">Ver Estudiantes</a>
	<form th:action="@{/logout}" method="post" class="d-inline">
	    <button type="submit" class="btn btn-outline-danger">Cerrar Sesión</button>
	</form>
</body>
</html>
