<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/cursos}">EduManager</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Enlaces exclusivos para Administrador -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/cursos}">Cursos</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/estudiantes}">Estudiantes</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/evaluaciones}">Gestionar Notas</a>
                    </li>

                    <!-- Enlace exclusivo para Estudiante (Oculto para ADMIN) -->
                    <li class="nav-item" sec:authorize="hasRole('USER') and !hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/cursos}">Mis Cursos y Notas</a>
                    </li>
                </ul>

                <!-- Información de Sesión -->
                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3 text-light" sec:authentication="name">Usuario</span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Script necesario para el funcionamiento del menú desplegable -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </nav>

</body>
</html>
